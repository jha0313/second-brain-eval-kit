# brain-publish: the only writer of the shared brain (Phase 2 design §6.3, "ops repo" mode). Manual only (Phase 3 adds a
# daily schedule). Copy to .github/workflows/brain-publish.yml in the OPS repo: a private repo that holds this kit at
# skills/codebase-brain/ and nothing else. The source repo (the service) gets no file and no secret from this.
#
# Set up in the ops repo (README "Shared brain: publishing"):
#   - env BRAIN_SOURCE_REPO below: the source repo, owner/name. It is written here, never taken as an input (R1).
#   - secret BRAIN_WRITER_URL: the brain_writer URL (direct endpoint). It exists only here.
#   - secret BRAIN_SOURCE_TOKEN: a fine-grained token that can read the source repo (contents, pull requests, issues).
#   - only admins can push; Actions secrets are not sent to workflows from fork pull requests.
# The first run binds the database to the source repo's numeric id; a later run for any other repo writes nothing (V22).
name: brain-publish

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Fetch all of GitHub (the first run, and once after a sanitize_version bump, R15)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: brain-publish
  cancel-in-progress: false

env:
  BRAIN_SOURCE_REPO: your-org/your-service
  BRAIN_DIR: skills/codebase-brain

jobs:
  publish:
    # workflow_dispatch can name any ref; only the reviewed main of the ops repo may write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # a full run fetches all of GitHub: about 2,700 requests for a repo with 1,300 PRs, tens of minutes under rate limits
    timeout-minutes: ${{ inputs.full && 330 || 30 }}
    steps:
      - name: check out the ops repo (the kit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false

      # fetch-depth 0: the commit memory and the ancestry check (R9) need the history
      - name: check out the source repo main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          repository: ${{ env.BRAIN_SOURCE_REPO }}
          ref: main
          path: src-repo
          fetch-depth: 0
          token: ${{ secrets.BRAIN_SOURCE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.BRAIN_DIR }}/package-lock.json

      - name: install the kit
        working-directory: ${{ env.BRAIN_DIR }}
        timeout-minutes: 2
        run: npm ci --ignore-scripts

      # the mirror of the last published run (R3); the publish step checks it against the run's checksum
      - name: restore the mirror
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: .brain-mirror
          key: brain-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: brain-mirror-

      # Only this step sees the writer URL. ci-publish runs build and sync as child processes without it (and without the
      # source token, which sync gets as GH_TOKEN), with BRAIN_TYPESCRIPT=kit: the source repo's own code never runs.
      - name: publish
        timeout-minutes: ${{ inputs.full && 320 || 20 }}
        env:
          BRAIN_WRITER_URL: ${{ secrets.BRAIN_WRITER_URL }}
          BRAIN_SOURCE_TOKEN: ${{ secrets.BRAIN_SOURCE_TOKEN }}
          FULL: ${{ inputs.full }}
        run: |
          args=(--source src-repo --mirror .brain-mirror --work "$RUNNER_TEMP/brain-work")
          if [ "$FULL" = true ]; then args+=(--full); fi
          node "$BRAIN_DIR/src/pg/ci-publish.mjs" "${args[@]}"

      - name: save the mirror
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 1
        with:
          path: .brain-mirror
          key: brain-mirror-${{ github.run_id }}-${{ github.run_attempt }}
