<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* layout: sticky section index on the left, one reading column, widgets sit inside the section they explain */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --sunk: #eef1f5; --fg: #18202b; --muted: #5a6475; --line: #dbe0e8;
  --accent: #2f54c8; --accent-soft: #e5ebfb; --amber: #a86512; --amber-soft: #fbf0df; --ok: #23784f; --ok-soft: #e1f3ea;
  --bad: #b8312f; --bad-soft: #fbe6e5; --term-bg: #111722; --term-fg: #d7dee9; --term-dim: #7f8ba0;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c26; --sunk: #1b2430; --fg: #e4e9f1; --muted: #98a3b4; --line: #283242;
  --accent: #86a2ff; --accent-soft: #1e2a4a; --amber: #e3a650; --amber-soft: #3a2a14; --ok: #5ccb8e; --ok-soft: #15322a;
  --bad: #f07a76; --bad-soft: #3a1a1c; --term-bg: #0a0e14; --term-fg: #d7dee9; --term-dim: #7f8ba0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --sunk: #1b2430; --fg: #e4e9f1; --muted: #98a3b4; --line: #283242;
  --accent: #86a2ff; --accent-soft: #1e2a4a; --amber: #e3a650; --amber-soft: #3a2a14; --ok: #5ccb8e; --ok-soft: #15322a;
  --bad: #f07a76; --bad-soft: #3a1a1c; --term-bg: #0a0e14; --term-fg: #d7dee9; --term-dim: #7f8ba0; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 16px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
code { font: 0.86em var(--font-mono); background: var(--sunk); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
strong { font-weight: 600; }
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 80px; }
nav.toc { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; font-size: 13px; padding-right: 8px; }
nav.toc .toc-head { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
nav.toc a { display: block; text-decoration: none; color: var(--muted); padding: 3px 10px; border-left: 2px solid transparent; line-height: 1.45; }
nav.toc a.toc-l3 { padding-left: 22px; font-size: 12.5px; }
nav.toc a:hover { color: var(--fg); }
nav.toc a.on { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
details.toc-mobile { display: none; }
main { min-width: 0; max-width: 980px; }
header.hero { padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
header.hero .eyebrow { font: 500 12px var(--font-mono); color: var(--accent); letter-spacing: 0.04em; }
h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.25; margin: 6px 0 16px; text-wrap: balance; font-weight: 700; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; color: var(--fg); }
.chip span { color: var(--muted); margin-right: 6px; }
.theme-toggle { float: right; font: 12px var(--font-body); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
section.sec { padding-top: 28px; }
h2 { font-size: 23px; line-height: 1.35; margin: 18px 0 12px; text-wrap: balance; font-weight: 700; padding-top: 10px; border-top: 1px solid var(--line); }
section.sec:first-of-type h2 { border-top: 0; }
h3 { font-size: 18px; margin: 30px 0 10px; text-wrap: balance; font-weight: 600; }
h4 { font-size: 15px; margin: 20px 0 6px; }
p, li { max-width: 72ch; }
ul, ol { padding-left: 1.3em; }
li { margin: 4px 0; }
#s0 { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 24px 14px; margin-top: 24px; }
#s0 h2 { border-top: 0; }
#s0 li { margin: 10px 0; }
blockquote { margin: 14px 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; }
blockquote p { margin: 0; }
.table-wrap { overflow-x: auto; margin: 14px 0 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.55; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--sunk); font-weight: 600; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 500; }
.term-wrap { overflow-x: auto; margin: 14px 0; border-radius: 10px; background: var(--term-bg); }
pre.term { margin: 0; padding: 14px 16px; font: 12.5px/1.6 var(--font-mono); color: var(--term-fg); white-space: pre; }
figure.diagram { margin: 16px 0 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow-x: auto; cursor: zoom-in; }
figure.diagram:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
figure.diagram pre.mermaid { margin: 0; text-align: center; font: 12px var(--font-mono); color: var(--muted); }
figure.diagram svg { max-width: 100%; height: auto; }
figure.diagram figcaption { font-size: 11.5px; color: var(--muted); text-align: right; margin-top: 4px; }
.zoom { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); z-index: 50; display: flex; flex-direction: column;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.zoom .bar { display: flex; justify-content: flex-end; gap: 8px; }
.zoom .stage { flex: 1; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; padding: 16px; }
.zoom .stage svg { max-width: none !important; height: auto; }
.btn { font: 500 13px var(--font-body); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
/* widgets */
.widget { margin: 22px 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; }
.widget > .w-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 10px; }
.widget > .w-head b { font-size: 15px; }
.widget > .w-head small { color: var(--muted); font-size: 12.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 13px; margin: 8px 0 14px; }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.controls select, .controls input[type=range] { font: 13px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.sim-out { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.reqlog { background: var(--term-bg); color: var(--term-fg); border-radius: 10px; font: 12px/1.65 var(--font-mono); padding: 10px 12px; height: 260px; overflow: auto; }
.reqlog div { white-space: pre; }
.reqlog .ok { color: #7fd6a4; } .reqlog .err { color: #ff8f8a; } .reqlog .dim { color: var(--term-dim); } .reqlog .db { color: #9fb6ff; }
.result { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; background: var(--sunk); }
.result .big { font: 600 15px var(--font-body); margin-bottom: 6px; }
.pill { display: inline-block; font: 500 11.5px var(--font-mono); padding: 1px 8px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.warn { background: var(--amber-soft); color: var(--amber); } .pill.info { background: var(--accent-soft); color: var(--accent); }
.result dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 0; }
.result dt { color: var(--muted); } .result dd { margin: 0; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tab { font: 500 13px var(--font-mono); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.tab .n { opacity: .7; margin-right: 6px; }
.term .q { color: #f4c77a; } .term .h { color: #9fb6ff; } .term .f { color: #7fd6a4; } .term .x { color: #ff8f8a; } .term .d { color: var(--term-dim); }
.waves { display: grid; grid-template-columns: repeat(var(--waves, 5), minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.wave h5 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; }
.task { display: block; width: 100%; text-align: left; font: 13px/1.4 var(--font-body); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; transition: opacity .2s, border-color .2s, background .2s; }
.task b { font-family: var(--font-mono); color: var(--accent); margin-right: 6px; }
.task .sz { float: right; font: 11px var(--font-mono); color: var(--muted); }
.task.dim { opacity: .32; }
.task.sel { border-color: var(--accent); background: var(--accent-soft); }
.task.up { border-color: var(--amber); }
.task.down { border-color: var(--ok); }
.task.crit { box-shadow: inset 3px 0 0 var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 8px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 2px solid; }
.detail { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; background: var(--sunk); min-height: 70px; }
.detail dl { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 12px; margin: 0; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
@media (max-width: 1080px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.toc { display: none; }
  details.toc-mobile { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 12px 0 0; font-size: 13.5px; }
  details.toc-mobile a { display: block; padding: 3px 0; text-decoration: none; color: var(--fg); }
  details.toc-mobile a.toc-l3 { padding-left: 14px; color: var(--muted); }
}
@media (max-width: 720px) {
  .sim-out { grid-template-columns: minmax(0, 1fr); }
  #s0 { padding: 4px 16px 10px; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="toc" aria-label="목차"><p class="toc-head">목차</p>{{TOC}}</nav>
  <main>
    <header class="hero">
      <button class="theme-toggle" id="themeBtn" type="button">테마 전환</button>
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{H1}}</h1>
      <div class="chips">{{META}}</div>
      <details class="toc-mobile"><summary>목차</summary>{{TOC}}</details>
    </header>
{{BODY}}
  </main>
</div>
<div class="zoom" id="zoom" hidden><div class="bar"><button class="btn" id="zoomIn" type="button">확대</button><button class="btn" id="zoomOut" type="button">축소</button><button class="btn primary" id="zoomClose" type="button">닫기 (Esc)</button></div><div class="stage" id="zoomStage"></div></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
const PLAN = {{PLAN}};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- theme ----------
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
$('#themeBtn').onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; renderDiagrams(); };

// ---------- mermaid ----------
const sources = $$('pre.mermaid').map((el) => el.textContent);
async function renderDiagrams() {
  if (!window.mermaid) { $$('pre.mermaid').forEach((el) => el.textContent = '다이어그램을 그리려면 인터넷 연결이 필요합니다 (mermaid CDN).\n\n' + el.textContent); return; }
  const cs = getComputedStyle(document.documentElement);
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base', fontFamily: 'IBM Plex Sans KR, sans-serif',
    themeVariables: { darkMode: isDark(), background: cs.getPropertyValue('--surface').trim(), primaryColor: cs.getPropertyValue('--accent-soft').trim(),
      primaryTextColor: cs.getPropertyValue('--fg').trim(), primaryBorderColor: cs.getPropertyValue('--accent').trim(), lineColor: cs.getPropertyValue('--muted').trim(),
      secondaryColor: cs.getPropertyValue('--sunk').trim(), tertiaryColor: cs.getPropertyValue('--surface').trim(), textColor: cs.getPropertyValue('--fg').trim(),
      noteBkgColor: cs.getPropertyValue('--amber-soft').trim(), noteTextColor: cs.getPropertyValue('--fg').trim(), noteBorderColor: cs.getPropertyValue('--amber').trim(),
      actorBkg: cs.getPropertyValue('--accent-soft').trim(), actorBorder: cs.getPropertyValue('--accent').trim(), actorTextColor: cs.getPropertyValue('--fg').trim(),
      signalColor: cs.getPropertyValue('--fg').trim(), signalTextColor: cs.getPropertyValue('--fg').trim(), labelBoxBkgColor: cs.getPropertyValue('--sunk').trim(),
      clusterBkg: cs.getPropertyValue('--sunk').trim(), clusterBorder: cs.getPropertyValue('--line').trim(), edgeLabelBackground: cs.getPropertyValue('--surface').trim(),
      fontSize: '13px' } });
  const els = $$('pre.mermaid');
  els.forEach((el, k) => { el.removeAttribute('data-processed'); el.textContent = sources[k]; });
  try { await mermaid.run({ nodes: els }); } catch (e) { console.error(e); }
}
renderDiagrams();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) renderDiagrams(); });

// zoom
let zoomScale = 1;
const openZoom = (fig) => { const svg = $('svg', fig); if (!svg) return; const stage = $('#zoomStage'); stage.innerHTML = ''; const c = svg.cloneNode(true);
  const vb = svg.viewBox.baseVal; zoomScale = 1; c.dataset.w = vb && vb.width ? vb.width : svg.getBoundingClientRect().width; c.style.width = (c.dataset.w * 1.4) + 'px'; stage.append(c); $('#zoom').hidden = false; $('#zoomClose').focus(); };
const scaleZoom = (f) => { const c = $('#zoomStage svg'); if (!c) return; zoomScale *= f; c.style.width = (c.dataset.w * 1.4 * zoomScale) + 'px'; };
$$('figure.diagram').forEach((fig) => { fig.onclick = () => openZoom(fig); fig.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openZoom(fig); } }; });
$('#zoomClose').onclick = () => { $('#zoom').hidden = true; };
$('#zoomIn').onclick = () => scaleZoom(1.25); $('#zoomOut').onclick = () => scaleZoom(0.8);
addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#zoom').hidden = true; });

// ---------- toc scrollspy ----------
const links = $$('nav.toc a');
const targets = links.map((a) => document.getElementById(a.dataset.id)).filter(Boolean);
const spy = () => { let cur = targets[0]; for (const t of targets) if (t.getBoundingClientRect().top < 120) cur = t;
  links.forEach((a) => a.classList.toggle('on', a.dataset.id === cur?.id)); };
addEventListener('scroll', spy, { passive: true }); spy();

// ---------- built-in widget: task explorer (from the §8 task table) ----------
(function () {
  const root = $('#w-plan'); if (!root) return;
  const TASKS = PLAN.tasks, byId = Object.fromEntries(TASKS.map((t) => [t.id, t])), CRIT = new Set(PLAN.crit);
  const grid = $('.waves', root), detail = $('.detail', root), crit = $('#planCrit', root);
  const md = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const short = (s) => s.replace(/`/g, '').replace(/\*\*/g, '').split(/[.:(]/)[0].slice(0, 46);
  grid.innerHTML = Array.from({ length: PLAN.waves }, (_, k) => `<div class="wave"><h5>웨이브 ${k}${k === 0 ? ' · 시작' : ''}</h5>${TASKS.filter((t) => t.wave === k).map((t) =>
    `<button type="button" class="task" data-id="${t.id}"><b>${t.id}</b><span class="sz">${md(t.size)}</span>${md(short(t.work))}</button>`).join('')}</div>`).join('');
  const up = (id, acc = new Set()) => { for (const d of byId[id]?.deps || []) if (!acc.has(d)) { acc.add(d); up(d, acc); } return acc; };
  const down = (id, acc = new Set()) => { for (const t of TASKS) if (t.deps.includes(id) && !acc.has(t.id)) { acc.add(t.id); down(t.id, acc); } return acc; };
  let sel = null;
  const row = (k, v) => (v ? `<dt>${k}</dt><dd>${v}</dd>` : '');
  const paint = () => {
    const u = sel ? up(sel) : new Set(), d = sel ? down(sel) : new Set();
    $$('.task', grid).forEach((b) => { const id = b.dataset.id;
      b.classList.toggle('sel', id === sel); b.classList.toggle('up', u.has(id)); b.classList.toggle('down', d.has(id));
      b.classList.toggle('dim', !!sel && id !== sel && !u.has(id) && !d.has(id)); b.classList.toggle('crit', crit.checked && CRIT.has(id)); });
    if (!sel) { detail.innerHTML = '<span style="color:var(--muted)">작업을 누르면 먼저 끝나야 하는 작업(주황)과 이 작업을 기다리는 작업(초록), 받는 것·내놓는 것·완료 기준이 나옵니다.</span>'; return; }
    const t = byId[sel];
    detail.innerHTML = `<dl>${row('작업', `<b>${t.id}</b> · ${md(t.work)}`)}${row('받는 것', md(t.recv))}${row('내놓는 것', md(t.out))}${row('의존 (표)', md(t.depsText))}
      ${row('먼저 끝날 것', [...u].join(', ') || '없음')}${row('기다리는 작업', [...d].join(', ') || '없음')}${row('크기', md(t.size))}${row('완료 기준', md(t.done))}</dl>`;
  };
  grid.onclick = (e) => { const b = e.target.closest('.task'); if (!b) return; sel = sel === b.dataset.id ? null : b.dataset.id; paint(); };
  crit.onchange = paint; paint();
})();

{{WIDGET_JS}}
</script>
</body>
</html>
