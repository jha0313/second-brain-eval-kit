[project]
name = "skill-eval"
version = "0.1.0"
description = "Prototype eval harness for Claude Code skills: isolated headless trials, hard checks, LLM judge, paired comparisons, scorecard.html"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
skill-eval = "skill_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_eval"]
