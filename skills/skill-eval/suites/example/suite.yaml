# 예시 suite: 형식만 보여 줍니다. <…> 자리를 내 repo에 맞게 바꿉니다. 결과(runs/)는 들어 있지 않습니다.
# 순서: 케이스·정답 작성 → skill-eval selftest → freeze → run --dry-run → run (SKILL.md "순서")
name: example
skill: codebase-brain                 # .claude/skills/<skill>/ 로 설치되는 이름
arms:
  none: null                          # 스킬 없음
  v1: ../../../codebase-brain         # 비교할 스킬 폴더
repo:
  path: ${MY_REPO}                    # export MY_REPO=/path/to/clone (또는 --repo DIR)
  label: my-repo
  commit: <40자 커밋 SHA>              # 케이스와 정답을 만든 커밋
  strip: [.claude, .agents, .codex]   # repo의 agent 설정은 모든 arm에서 뺀다
cases: cases/*.json
find_all_pass: {min_recall: 0.9, min_precision: 0.8}   # 결과를 보기 전에 정하고 freeze로 고정
# codebase-brain 인덱스는 호스트에서 한 번 만들고, 같은 파일을 스킬 arm에만 읽기 전용으로 넣는다
prepare: $SKILL_DIR/bin/brain build . --db .codebase-brain/brain.db
prepare_outputs: [.codebase-brain/brain.db]
skill_env:
  BRAIN_DB: "{ws}/.codebase-brain/brain.db"
deny_read: [~/.cache/codebase-brain]
skill_use: {tool: Bash, match: 'bin/brain\b|\bbrain (find|refs|callers|impact|shared|deps|why|status)\b'}   # routing 진단
model: claude-sonnet-5-5
judge_model: claude-opus-5-5
k: 3
votes: 3
tools: Bash,Read,Grep,Glob,Skill
limits: {max_turns: 40, timeout_s: 900, max_usd: 3.0}
pass_threshold: 0.7
compare: [[none, v1]]
